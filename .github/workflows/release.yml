name: Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    if: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && github.event.deleted != true }}
    outputs:
      eligible: ${{ steps.pr.outputs.eligible }}
      pr_number: ${{ steps.pr.outputs.number }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      commit_count: ${{ steps.pr.outputs.commit_count }}
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve merged feature PR
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/resolve_merged_pr.py

  publish:
    name: Serialized native release
    needs: prepare
    if: >-
      ${{ always()
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.eligible == 'true' }}
    concurrency:
      group: release-${{ github.repository }}-${{ github.event.repository.default_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/release-native.yml
    with:
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      base_ref: ${{ needs.prepare.outputs.base_ref }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      commit_count: ${{ needs.prepare.outputs.commit_count }}
