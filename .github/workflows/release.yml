name: Release

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.repository }}-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    if: >-
      ${{ github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == github.event.repository.default_branch
      && startsWith(github.event.pull_request.head.ref, 'feature/') }}
    outputs:
      release_required: ${{ steps.compute.outputs.release_required }}
      release_kind: ${{ steps.compute.outputs.release_kind }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
      git_tag: ${{ steps.compute.outputs.git_tag }}
      docker_tag: ${{ steps.compute.outputs.docker_tag }}
      tag_exists: ${{ steps.compute.outputs.tag_exists }}
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Fetch PR head for git fallback
        continue-on-error: true
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --force origin "refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" || true
          git fetch --force origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pull/${PR_NUMBER}/head"

      - name: Compute release metadata
        id: compute
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}  # diagnostics only; release classification ignores PR titles
        run: python3 scripts/release/compute_release.py

      - name: Skip when no release is required
        if: steps.compute.outputs.release_required != 'true'
        run: echo "No releasable commit messages were found for this merged pull request."
      - name: Create annotated git tag
        if: steps.compute.outputs.release_required == 'true' && steps.compute.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.compute.outputs.git_tag }}" -m "Release ${{ steps.compute.outputs.git_tag }}"
          git push origin "${{ steps.compute.outputs.git_tag }}"

  publish:
    name: Publish release
    needs: prepare
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    if: >-
      ${{ always()
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.release_required == 'true' }}
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin
      - uses: docker/setup-buildx-action@v4
        id: builder
      - name: Build extension and both installers
        env:
          PROJECT_VERSION: ${{ needs.prepare.outputs.docker_tag }}
        run: python3 scripts/build.py --version "$PROJECT_VERSION" --builder '${{ steps.builder.outputs.name }}' --registry-prefix "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and require anonymous pull
        run: |
          python3 scripts/publish.py --images .build/images.json --output .build/release-images.json
          cp .build/release-images.json .build/approved-runtime-images.json
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mkdir -p .github/tmp &&
          python3 scripts/release/generate_release_notes.py
          --repo "${GITHUB_REPOSITORY}"
          --previous-tag "${{ needs.prepare.outputs.previous_tag }}"
          --target "${{ github.event.pull_request.merge_commit_sha }}"
          --pr-number "${{ github.event.pull_request.number }}"
          --output .github/tmp/release-notes.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.git_tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          body_path: .github/tmp/release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            .build/release-images.json
            .build/approved-runtime-images.json
            .build/images.json
            .build/evidence/build-metadata.json
            .build/sources.tar.gz
