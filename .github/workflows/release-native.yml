# The caller's publish job holds the release concurrency lock across all jobs.
name: Native release implementation
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      base_ref:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      commit_count:
        type: string
        required: true
permissions:
  contents: read
  pull-requests: read
jobs:
  metadata:
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      release_required: ${{ steps.compute.outputs.release_required }}
      git_tag: ${{ steps.compute.outputs.git_tag }}
      docker_tag: ${{ steps.compute.outputs.docker_tag }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
      reuse: ${{ steps.original.outputs.reuse }}
    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Fetch PR head for git fallback
        continue-on-error: true
        env:
          PR_BASE_REF: ${{ inputs.base_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          git fetch --force origin "refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" || true
          git fetch --force origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pull/${PR_NUMBER}/head"

      - name: Compute release metadata
        id: compute
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COMMIT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ inputs.base_sha }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          PR_COMMIT_COUNT: ${{ inputs.commit_count }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 scripts/release/compute_release.py

      - name: Skip when no release is required
        if: steps.compute.outputs.release_required != 'true'
        run: echo "No releasable commit messages were found for this merged pull request."
      - name: Create annotated git tag
        if: steps.compute.outputs.release_required == 'true' && steps.compute.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.compute.outputs.git_tag }}" -m "Release ${{ steps.compute.outputs.git_tag }}"
          git push origin "${{ steps.compute.outputs.git_tag }}"

      - name: Inspect original release state
        id: original
        if: steps.compute.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/reuse_inputs.py --inspect-only --tag '${{ steps.compute.outputs.git_tag }}'

  build:
    needs: metadata
    if: needs.metadata.outputs.release_required == 'true' && needs.metadata.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && (vars.ACTIONS_RUNNER_ARM64 || 'ubuntu-24.04-arm') || (vars.ACTIONS_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Require native target runner
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PYCODE'
          import os, platform
          actual = {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(platform.machine())
          if actual != os.environ['TARGET_ARCH']: raise SystemExit('Native target runner required')
          PYCODE
      - uses: docker/setup-buildx-action@v4
        id: builder
      - name: Build all native release artifacts
        env:
          PROJECT_VERSION: ${{ needs.metadata.outputs.docker_tag }}
        run: python3 scripts/build.py --version "$PROJECT_VERSION" --arch '${{ matrix.arch }}' --output .build --builder '${{ steps.builder.outputs.name }}' --registry-prefix "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" --with-probe
      - name: Generate and inspect Standard Oracle ARM64 release disks
        if: matrix.arch == 'arm64'
        run: python3 scripts/oracle_disk.py --build-output .build --builder '${{ steps.builder.outputs.name }}'
      - name: Retain Oracle generation diagnostics
        if: always() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: oracle-release-diagnostics
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: warn
          path: |
            .build/oracle.partial-*/generator.log
            .build/oracle.partial-*/conversion.log
            .build/oracle.partial-*/loop.json
            .build/oracle.partial-*/FAILED.txt
            .build/oracle.partial-*/original-imager-output.json
      - uses: actions/upload-artifact@v7
        with:
          name: native-release-${{ matrix.arch }}
          retention-days: 2
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/images.json
            .build/sources.tar.gz
            .build/extension.tar
            .build/standard-image.tar
            .build/vmware-image.tar
            .build/probe-image.tar
            .build/evidence/build-metadata.json
            .build/oracle/*

  publish:
    needs: [metadata, build]
    if: >-
      ${{ always() && needs.metadata.result == 'success'
      && needs.metadata.outputs.release_required == 'true'
      && (needs.build.result == 'success' || needs.metadata.outputs.reuse == 'true') }}
    runs-on: ${{ vars.ACTIONS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      packages: write
      pull-requests: read
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reuse original release inputs on rerun
        id: original
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/reuse_inputs.py --tag '${{ needs.metadata.outputs.git_tag }}'
      - uses: actions/download-artifact@v8
        if: steps.original.outputs.reuse != 'true'
        with:
          name: native-release-amd64
          path: .build/amd64
      - uses: actions/download-artifact@v8
        if: steps.original.outputs.reuse != 'true'
        with:
          name: native-release-arm64
          path: .build/arm64
      - name: Combine and load exact original native archives
        if: steps.original.outputs.reuse != 'true'
        run: |
          python3 scripts/release/combine_inputs.py --require-oracle
          python3 - <<'PYCODE'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from reuse_inputs import restore_images
          restore_images(json.loads(Path('.build/images.json').read_text()), Path('.build'))
          PYCODE
      - name: Registry login
        if: needs.metadata.outputs.release_required == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check publication prerequisites before staging
        if: needs.metadata.outputs.release_required == 'true' && steps.original.outputs.completed != 'true'
        run: python3 scripts/publish.py --preflight-only --images .build/images.json --output .build/preflight-images.json
      - name: Retain original archives and corresponding sources
        if: needs.metadata.outputs.release_required == 'true' && steps.original.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/stage_release.py --tag '${{ needs.metadata.outputs.git_tag }}' --preflight .build/preflight-images.json
      - name: Make matching sources public before every binary push
        if: needs.metadata.outputs.release_required == 'true' && steps.original.outputs.completed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit '${{ needs.metadata.outputs.git_tag }}' --draft=false
      - name: Publish and require anonymous pull
        if: needs.metadata.outputs.release_required == 'true'
        run: |
          if [ '${{ steps.original.outputs.completed }}' = true ]; then
            python3 scripts/publish.py --verify-existing --images .build/images.json --output .build/verified-images.json
            python3 - <<'PY'
          import json, pathlib
          previous=pathlib.Path('.build/release-images.json')
          verified=json.load(open('.build/verified-images.json'))
          if previous.exists() and json.loads(previous.read_text())['images'] != verified['images']: raise SystemExit('Published release digest changed; refusing rerun')
          previous.write_text(json.dumps(verified,indent=2)+'\n')
          PY
          else
            python3 scripts/publish.py --images .build/images.json --output .build/release-images.json
          fi
          cp .build/release-images.json .build/approved-runtime-images.json
          python3 - <<'PY'
          import json, pathlib
          result=json.load(open('.build/release-images.json'))
          pathlib.Path('.build/test-images.lock.json').unlink(missing_ok=True)
          if 'test_image_lock' in result:
              pathlib.Path('.build/test-images.lock.json').write_text(json.dumps(result['test_image_lock'],indent=2)+'\n')
          for arch, lock in result.get('test_image_locks', {}).items():
              pathlib.Path('.build/' + arch + '-test-images.lock.json').write_text(json.dumps(lock,indent=2)+'\n')
          PY
      - name: Generate release notes
        if: needs.metadata.outputs.release_required == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mkdir -p .github/tmp &&
          python3 scripts/release/generate_release_notes.py
          --repo "${GITHUB_REPOSITORY}"
          --previous-tag "${{ needs.metadata.outputs.previous_tag }}"
          --target "${{ github.sha }}"
          --pr-number "${{ inputs.pr_number }}"
          --output .github/tmp/release-notes.md

      - name: Create or update GitHub Release
        if: needs.metadata.outputs.release_required == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.git_tag }}
          target_commitish: ${{ github.sha }}
          body_path: .github/tmp/release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            .build/release-images.json
            .build/approved-runtime-images.json
            .build/test-images.lock.json
            .build/amd64-test-images.lock.json
            .build/arm64-test-images.lock.json
