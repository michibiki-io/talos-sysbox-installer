name: Test
on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_runtime:
        description: Run privileged Talos-in-Docker checks explicitly
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04-arm' || vars.ACTIONS_RUNNER_ARM64 || 'ubuntu-24.04-arm') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.ACTIONS_RUNNER || 'ubuntu-latest') }}
    # Allow extra corresponding-source collection time for fixed-snapshot latency.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Require native target runner
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PYCODE'
          import os, platform
          actual = {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(platform.machine())
          if actual != os.environ['TARGET_ARCH']: raise SystemExit('Native target runner required')
          PYCODE
      - name: Install locked validation clients
        run: python3 scripts/install_test_tools.py
      - name: Unit checks
        run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v4
        id: builder
      - name: Locked inputs
        run: |
          python3 - <<'PY'
          import json, os
          lock=json.load(open('versions.arm64.lock.json' if '${{ matrix.arch }}' == 'arm64' else 'versions.lock.json'))
          with open(os.environ['GITHUB_ENV'],'a') as f:
            f.write('GO_IMAGE='+lock['go']+'\nUBUNTU_IMAGE='+lock['ubuntu']+'\nAPT_SNAPSHOT='+lock['apt_snapshot']+'\nCATALOGUE_IMAGE='+lock['catalogue']+'\n')
          PY
      - name: Stage selected lock for cached Docker build
        if: matrix.arch == 'arm64'
        run: cp versions.arm64.lock.json versions.lock.json
      - name: Cached native build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          target: evidence
          platforms: linux/${{ matrix.arch }}
          push: false
          outputs: type=local,dest=.build/evidence
          build-args: |
            GO_IMAGE=${{ env.GO_IMAGE }}
            UBUNTU_IMAGE=${{ env.UBUNTU_IMAGE }}
            APT_SNAPSHOT=${{ env.APT_SNAPSHOT }}
            CATALOGUE_IMAGE=${{ env.CATALOGUE_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Restore default lock after cached build
        if: always() && matrix.arch == 'arm64'
        run: git restore -- versions.lock.json
      - name: Build both installers and probe (no publication)
        run: python3 scripts/build.py --builder '${{ steps.builder.outputs.name }}' --arch '${{ matrix.arch }}' --output .build --with-probe
      - name: Generate and inspect Standard Oracle ARM64 disks (no boot)
        if: matrix.arch == 'arm64'
        run: python3 scripts/oracle_disk.py --build-output .build --builder '${{ steps.builder.outputs.name }}'
      - name: Validate complete release assets offline
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.release.stage_release import validate_assets
          directory = Path('.build')
          inputs = json.loads((directory / 'images.json').read_text())
          if 'probe' not in inputs:
              raise RuntimeError('Missing integrated probe record')
          assets = validate_assets(inputs, directory)
          proof = {'archiveImageCount': len(inputs['image_archives']),
                   'sourceBytes': (directory / 'sources.tar.gz').stat().st_size,
                   'assetBytes': {p.name: p.stat().st_size for p in assets}}
          if proof['archiveImageCount'] != 4 or proof['sourceBytes'] == 0:
              raise RuntimeError('Expected four original archives and complete sources')
          (directory / 'release-asset-sizes.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - name: Upload complete Oracle disks and input evidence
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: standard-oracle-arm64
          include-hidden-files: true
          retention-days: 14
          compression-level: 0
          path: .build/oracle/*
          if-no-files-found: error
      - name: Supporting Talos-in-Docker runtime checks
        if: github.event_name == 'workflow_dispatch' && inputs.run_runtime == true
        run: |
          sudo modprobe br_netfilter
          python3 test/e2e/scripts/talos_docker.py --lock "${{ matrix.arch == 'arm64' && 'versions.arm64.lock.json' || 'versions.lock.json' }}" --rootfs .build/evidence/rootfs --subnet 10.77.0.0/24
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-and-validation-evidence-${{ matrix.arch }}
          include-hidden-files: true
          path: |
            .build/validation/test-images.lock.json
            .build/evidence/validation/artifacts.lock.json
            .build/evidence/validation/upstream-results.json
            .build/extension-assertions.json
            .build/release-asset-sizes.json
            .build/images.json
            .build/evidence/build-metadata.json
            .build/standard/inputs.json
            .build/vmware/inputs.json
            .build/oracle.partial-*/generator.log
            .build/oracle.partial-*/conversion.log
            .build/oracle.partial-*/FAILED.txt
            .build/oracle.partial-*/original-imager-output.json
            test/e2e/results/*.json
          if-no-files-found: warn
